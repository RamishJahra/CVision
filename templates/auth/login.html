{% extends "layouts/base.html" %}

{% block title %}
Login | CVision
{% endblock %}

{% block content %}

<div class="container mt-5 pt-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

                <div class="row g-0">

                    <!-- LEFT -->
                    <div class="col-lg-5 d-flex align-items-center justify-content-center signup-image-box">

                        <div class="css-illustration">

                            <div class="illustration-circle">

                                <div class="circle-inner">

                                    <div class="center-icon">
                                        <i class="bi bi-box-arrow-in-right"></i>
                                    </div>

                                </div>

                            </div>

                            <div class="illustration-text">

                                <h3>Welcome Back</h3>

                                <p>Login and continue building your career.</p>

                            </div>

                        </div>

                    </div>

                    <!-- RIGHT -->

                    <div class="col-lg-7 p-5">

                        <h2 class="signup-title mb-4">
                            Sign In
                        </h2>

                        <form method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Email or Username
                                </label>

                                <input
                                    type="text"
                                    name="identity"
                                    class="form-control"
                                    placeholder="Enter Email or Username"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        name="password"
                                        id="password"
                                        class="form-control"
                                        required>

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="showPassword">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                                <div class="text-end mt-2">

                                    <a href="{{ url_for('auth.forgot_password') }}">
                                        Forgot Password?
                                    </a>

                                </div>

                            </div>

                            <button class="btn register-btn w-100 mt-3">

                                Login

                            </button>

                        </form>

                        <div class="text-center mt-4">

                            Don't have an account?

                            <a href="{{ url_for('auth.register') }}">

                                Register

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}

<script>

document.getElementById("showPassword").onclick = function(){

    let password = document.getElementById("password");

    if(password.type==="password"){

        password.type="text";

        this.innerHTML='<i class="bi bi-eye-slash"></i>';

    }else{

        password.type="password";

        this.innerHTML='<i class="bi bi-eye"></i>';

    }

}

</script>

{% endblock %}
