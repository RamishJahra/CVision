{% extends "layouts/base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <h2 class="mb-4">
                Account Settings
            </h2>


            <!-- ==========================
                 Change Password
            =========================== -->

            <div class="card shadow-sm border-0 mb-4">

                <div class="card-body p-4">

                    <h5 class="mb-4">
                        Change Password
                    </h5>

                    <form
                        method="POST"
                        action="{{ url_for('applicant.change_password') }}"
                    >

                        <div class="mb-3">

                            <label class="form-label">
                                Current Password
                            </label>

                            <input
                                type="password"
                                name="current_password"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                New Password
                            </label>

                            <input
                                type="password"
                                name="new_password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                            <small class="text-muted">
                                Password must contain at least 8 characters.
                            </small>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Confirm New Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Change Password
                        </button>

                    </form>

                </div>

            </div>


            <!-- ==========================
                 Change Email
            =========================== -->

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h5 class="mb-4">
                        Change Email Address
                    </h5>


                    <div class="mb-3">

                        <label class="form-label">
                            Current Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            value="{{ current_user.email }}"
                            readonly
                        >

                    </div>


                    <form
                        method="POST"
                        action="{{ url_for('applicant.change_email') }}"
                    >

                        <div class="mb-4">

                            <label class="form-label">
                                New Email
                            </label>

                            <input
                                type="email"
                                name="new_email"
                                class="form-control"
                                placeholder="Enter new email address"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Change Email
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
