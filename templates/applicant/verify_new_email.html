{% extends "layouts/base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h3 class="mb-3">
                        Verify New Email
                    </h3>

                    <p class="text-muted">

                        Enter the verification code sent to:

                        <strong>
                            {{ pending_email }}
                        </strong>

                    </p>


                    <form
                        method="POST"
                        action="{{ url_for('applicant.verify_new_email') }}"
                    >

                        <div class="mb-4">

                            <label class="form-label">
                                Verification Code
                            </label>

                            <input
                                type="text"
                                name="verification_code"
                                class="form-control"
                                maxlength="6"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Verify Email
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
