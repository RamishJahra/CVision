{% extends "layouts/account_settings_base.html" %}

{% block title %}
Edit Project - CVision
{% endblock %}

{% block account_content %}

<div class="container-fluid py-4">

    <!-- ==================================================
         Header
    ================================================== -->

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Edit Project
            </h2>

            <p class="text-muted mb-0">
                Update your project information.
            </p>

        </div>

        <div class="mt-3 mt-md-0">

            <a
                href="{{ url_for('applicant.projects') }}"
                class="btn btn-outline-secondary"
            >
                <i class="bi bi-arrow-left me-1"></i>
                Back to Projects
            </a>

        </div>

    </div>


    <!-- ==================================================
         Edit Project Form
    ================================================== -->

    <div class="card border-0 shadow-sm">

        <div class="card-body p-4">

            <form
                method="POST"
                action="{{ url_for(
                    'applicant.edit_project',
                    project_id=project.id
                ) }}"
            >

                <!-- ======================================
                     Project Title
                ======================================= -->

                <div class="mb-4">

                    <label
                        for="project_title"
                        class="form-label fw-semibold"
                    >
                        Project Title
                        <span class="text-danger">*</span>
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="project_title"
                        name="project_title"
                        value="{{ project.project_title or '' }}"
                        placeholder="Enter project title"
                        required
                    >

                </div>


                <!-- ======================================
                     Technologies
                ======================================= -->

                <div class="mb-4">

                    <label
                        for="technologies"
                        class="form-label fw-semibold"
                    >
                        Technologies
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="technologies"
                        name="technologies"
                        value="{{ project.technologies or '' }}"
                        placeholder="e.g. Python, Flask, MySQL, Bootstrap"
                    >

                    <div class="form-text">
                        Separate multiple technologies with commas.
                    </div>

                </div>


                <!-- ======================================
                     Dates
                ======================================= -->

                <div class="row g-3 mb-4">

                    <!-- Start Date -->

                    <div class="col-md-6">

                        <label
                            for="start_date"
                            class="form-label fw-semibold"
                        >
                            Start Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="start_date"
                            name="start_date"
                            value="{% if project.start_date %}{{ project.start_date.strftime('%Y-%m-%d') }}{% endif %}"
                        >

                    </div>


                    <!-- End Date -->

                    <div class="col-md-6">

                        <label
                            for="end_date"
                            class="form-label fw-semibold"
                        >
                            End Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="end_date"
                            name="end_date"
                            value="{% if project.end_date %}{{ project.end_date.strftime('%Y-%m-%d') }}{% endif %}"
                        >

                    </div>

                </div>


                <!-- ======================================
                     Project URL
                ======================================= -->

                <div class="mb-4">

                    <label
                        for="project_url"
                        class="form-label fw-semibold"
                    >
                        Live Project URL
                    </label>

                    <input
                        type="url"
                        class="form-control"
                        id="project_url"
                        name="project_url"
                        value="{{ project.project_url or '' }}"
                        placeholder="https://example.com"
                    >

                </div>


                <!-- ======================================
                     GitHub URL
                ======================================= -->

                <div class="mb-4">

                    <label
                        for="github_url"
                        class="form-label fw-semibold"
                    >
                        GitHub URL
                    </label>

                    <input
                        type="url"
                        class="form-control"
                        id="github_url"
                        name="github_url"
                        value="{{ project.github_url or '' }}"
                        placeholder="https://github.com/username/project"
                    >

                </div>


                <!-- ======================================
                     Description
                ======================================= -->

                <div class="mb-4">

                    <label
                        for="description"
                        class="form-label fw-semibold"
                    >
                        Description
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        name="description"
                        rows="7"
                        placeholder="Describe your project..."
                    >{{ project.description or '' }}</textarea>

                </div>


                <!-- ======================================
                     Buttons
                ======================================= -->

                <div class="d-flex justify-content-end gap-2">

                    <a
                        href="{{ url_for('applicant.projects') }}"
                        class="btn btn-light border"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-check2-circle me-1"></i>
                        Update Project
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
