{% extends "layouts/account_settings_base.html" %}

{% block title %}
Import Complete - CVision
{% endblock %}

{% block account_content %}

<div class="container-fluid py-5">

    <div class="card border-0 shadow-sm">

        <div class="card-body text-center py-5">

            <div class="success-icon mb-4">

                <i class="bi bi-check-lg"></i>

            </div>

            <h2 class="fw-bold mb-2">
                Resume Import Complete
            </h2>

            <p class="text-muted mb-4">

                The selected information from
                <strong>{{ resume.file_name }}</strong>
                has been added to your profile.

            </p>

            <div class="d-flex justify-content-center gap-2">

                <a
                    href="{{ url_for('applicant.resumes') }}"
                    class="btn btn-outline-secondary"
                >
                    <i class="bi bi-file-earmark-text me-1"></i>
                    My Resumes
                </a>

                <a
                    href="{{ url_for('dashboard.home') }}"
                    class="btn btn-primary"
                >
                    <i class="bi bi-person-circle me-1"></i>
                    Go to Dashboard
                </a>

            </div>

        </div>

    </div>

</div>


<style>

.success-icon {

    width: 80px;
    height: 80px;

    margin-left: auto;
    margin-right: auto;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(25, 135, 84, 0.1);

    color: #198754;

    font-size: 2.5rem;

}

</style>

{% endblock %}
