{% extends "layouts/base.html" %}


{% block content %}

<div class="container-fluid py-5">

    <div class="row g-4">

        <!-- ==========================================
             ACCOUNT SETTINGS SIDEBAR
        =========================================== -->

        <div class="col-lg-3">

            <div class="card shadow-sm border-0">

                <div class="card-body p-3">

                    <h5 class="fw-bold px-3 pt-2 mb-4">
                        Account Settings
                    </h5>


                    <!-- Profile -->

                    <a href="{{ url_for('applicant.profile') }}"
                       class="settings-sidebar-link
                       {% if request.endpoint == 'applicant.profile' %}
                       active
                       {% endif %}">

                        <i class="bi bi-person"></i>

                        <span>
                            Profile
                        </span>

                    </a>


                    <!-- Education -->

                    <a href="{{ url_for('applicant.education') }}"
                       class="settings-sidebar-link
                       {% if request.endpoint == 'applicant.education' %}
                       active
                       {% endif %}">

                        <i class="bi bi-mortarboard"></i>

                        <span>
                            Education
                        </span>

                    </a>


                    <!-- Experience -->

                    <a href="{{ url_for('applicant.experience') }}"
                       class="settings-sidebar-link
                       {% if request.endpoint == 'applicant.experience' %}
                       active
                       {% endif %}">

                        <i class="bi bi-briefcase"></i>

                        <span>
                            Experience
                        </span>

                    </a>


                    <!-- Skills -->

                    <a href="{{ url_for('applicant.skills') }}"
                       class="settings-sidebar-link
                       {% if request.endpoint == 'applicant.skills' %}
                       active
                       {% endif %}">

                        <i class="bi bi-tools"></i>

                        <span>
                            Skills
                        </span>

                    </a>


                    <!-- Certifications -->

                    <a href="{{ url_for('applicant.certifications') }}"
                       class="settings-sidebar-link
                       {% if request.endpoint == 'applicant.certifications' %}
                       active
                       {% endif %}">

                        <i class="bi bi-award"></i>

                        <span>
                            Certifications
                        </span>

                    </a>


                    <!-- Projects -->

                    <a href="{{ url_for('applicant.projects') }}"
                       class="settings-sidebar-link
                       {% if request.endpoint == 'applicant.projects' %}
                       active
                       {% endif %}">

                        <i class="bi bi-folder"></i>

                        <span>
                            Projects
                        </span>

                    </a>


                    <hr class="my-3">


                    <!-- Security -->

                    <div class="px-3 mb-2">

                        <small class="text-muted fw-semibold">
                            SECURITY
                        </small>

                    </div>


                    <!-- Password & Email -->

                    <a href="{{ url_for('applicant.settings') }}"
                       class="settings-sidebar-link
                       {% if request.endpoint == 'applicant.settings' %}
                       active
                       {% endif %}">

                        <i class="bi bi-shield-lock"></i>

                        <span>
                            Password & Email
                        </span>

                    </a>

                </div>

            </div>

        </div>


        <!-- ==========================================
             CURRENT PAGE
        =========================================== -->

        <div class="col-lg-9">

            {% block account_content %}
            {% endblock %}

        </div>

    </div>

</div>


<style>

    .settings-sidebar-link {

        display: flex;

        align-items: center;

        gap: 12px;

        width: 100%;

        padding: 12px 15px;

        margin-bottom: 4px;

        border-radius: 10px;

        text-decoration: none;

        color: #333;

        transition: all 0.2s ease;

    }


    .settings-sidebar-link i {

        font-size: 18px;

        width: 22px;

        text-align: center;

    }


    .settings-sidebar-link:hover {

        background-color: #f1f5ff;

        color: #0d6efd;

    }


    .settings-sidebar-link.active {

        background-color: #e9f2ff;

        color: #0d6efd;

        font-weight: 600;

    }

</style>


{% endblock %}
