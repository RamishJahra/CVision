{% extends "layouts/base.html" %}

{% block content %}

<div class="container-fluid py-5">

    <div class="row g-4">


        <!-- ==========================================
             RECRUITER ACCOUNT SETTINGS SIDEBAR
        =========================================== -->

        <div class="col-lg-3">

            <div class="card shadow-sm border-0">

                <div class="card-body p-3">

                    <h5 class="fw-bold px-3 pt-2 mb-4">
                        Account Settings
                    </h5>


                    <!-- =================================
                         COMPANY PROFILE
                    ================================== -->

                    <a href="{{ url_for('recruiter.profile') }}"
                       class="recruiter-settings-sidebar-link
                       {% if request.endpoint == 'recruiter.profile' %}
                       active
                       {% endif %}">

                        <i class="bi bi-building"></i>

                        <span>
                            Company Profile
                        </span>

                    </a>


                    <!-- =================================
                         COMPANY INFORMATION
                    ================================== -->

                    <a href="{{ url_for('recruiter.profile') }}"
                       class="recruiter-settings-sidebar-link">

                        <i class="bi bi-info-circle"></i>

                        <span>
                            Company Information
                        </span>

                    </a>


                    <!-- =================================
                         JOB PREFERENCES
                    ================================== -->

                    <a href="#"
                       class="recruiter-settings-sidebar-link">

                        <i class="bi bi-sliders"></i>

                        <span>
                            Job Preferences
                        </span>

                    </a>


                    <!-- =================================
                         RECRUITER DETAILS
                    ================================== -->

                    <a href="{{ url_for('recruiter.profile') }}"
                       class="recruiter-settings-sidebar-link">

                        <i class="bi bi-person-badge"></i>

                        <span>
                            Recruiter Details
                        </span>

                    </a>


                    <!-- =================================
                         SECURITY
                    ================================== -->

                    <hr class="my-3">


                    <div class="px-3 mb-2">

                        <small class="text-muted fw-semibold">
                            SECURITY
                        </small>

                    </div>


                    <!-- Password & Email -->

                    <a href="{{ url_for('recruiter.settings') }}"
                       class="recruiter-settings-sidebar-link
                       {% if request.endpoint == 'recruiter.settings' %}
                       active
                       {% endif %}">

                        <i class="bi bi-shield-lock"></i>

                        <span>
                            Password & Email
                        </span>

                    </a>


                </div>

            </div>

        </div>


        <!-- ==========================================
             MAIN RECRUITER SETTINGS CONTENT
        =========================================== -->

        <div class="col-lg-9">

            {% block recruiter_account_content %}
            {% endblock %}

        </div>

    </div>

</div>


<!-- ==========================================
     RECRUITER SETTINGS SIDEBAR STYLES
=========================================== -->

<style>

    .recruiter-settings-sidebar-link {

        display: flex;

        align-items: center;

        gap: 12px;

        width: 100%;

        padding: 12px 15px;

        margin-bottom: 4px;

        border-radius: 10px;

        text-decoration: none;

        color: #333;

        transition: all 0.2s ease;

    }


    .recruiter-settings-sidebar-link i {

        font-size: 18px;

        width: 22px;

        text-align: center;

        flex-shrink: 0;

    }


    .recruiter-settings-sidebar-link:hover {

        background-color: #f1f5ff;

        color: #0d6efd;

    }


    .recruiter-settings-sidebar-link.active {

        background-color: #e9f2ff;

        color: #0d6efd;

        font-weight: 600;

    }


    /* ==========================================
       RESPONSIVE
    =========================================== */

    @media (max-width: 991px) {

        .recruiter-settings-sidebar-link {

            padding: 11px 14px;

        }

    }

</style>


{% endblock %}
