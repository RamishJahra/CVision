
{% extends "layouts/recruiter_settings_base.html" %}

{% block recruiter_account_content %}

<div class="container py-4">

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <!-- ==========================
                 Header
            =========================== -->

            <div class="mb-4">

                <h2 class="fw-bold mb-1">
                    Recruiter Profile
                </h2>

                <p class="text-muted mb-0">
                    Manage your personal recruiter information.
                </p>

            </div>


            <!-- ==========================
                 Profile Picture
            =========================== -->

            <div class="text-center mb-4">

                <img
                    src="{{ url_for(
                        'static',
                        filename='uploads/profile/' + current_user.profile_image
                    ) }}"
                    alt="Recruiter Profile"
                    class="rounded-circle border"
                    width="130"
                    height="130"
                    style="object-fit: cover;"
                >

                <h5 class="mt-3 mb-1">
                    {{ current_user.full_name }}
                </h5>

                <p class="text-muted mb-3">
                    Recruiter
                </p>


                <form
                    method="POST"
                    action="{{ url_for('recruiter.profile_picture') }}"
                    enctype="multipart/form-data"
                >

                    <div class="mb-3">

                        <input
                            type="file"
                            name="profile_image"
                            class="form-control"
                            accept=".jpg,.jpeg,.png,.webp"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-camera me-1"></i>
                        Update Profile Picture
                    </button>

                </form>

            </div>


            <hr class="my-4">


            <!-- ==========================
                 Personal Information
            =========================== -->

            <h5 class="fw-bold mb-3">
                Personal Information
            </h5>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ current_user.full_name }}"
                        readonly
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ current_user.username }}"
                        readonly
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        value="{{ current_user.email }}"
                        readonly
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ current_user.phone }}"
                        readonly
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        District
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ current_user.district.name if current_user.district else 'Not added' }}"
                        readonly
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Area
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ current_user.area.name if current_user.area else 'Not added' }}"
                        readonly
                    >

                </div>

            </div>


            <hr class="my-4">


            <!-- ==========================
                 Recruiter Information
            =========================== -->

            <h5 class="fw-bold mb-3">
                Recruiter Information
            </h5>

            <form
                method="POST"
                action="{{ url_for('recruiter.profile') }}"
            >

                <div class="row">

                    <!-- Job Title -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Job Title
                        </label>

                        <input
                            type="text"
                            name="job_title"
                            class="form-control"
                            value="{{ profile.job_title or '' }}"
                            placeholder="e.g. HR Manager"
                        >

                    </div>


                    <!-- LinkedIn -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            LinkedIn
                        </label>

                        <input
                            type="url"
                            name="linkedin_url"
                            class="form-control"
                            value="{{ profile.linkedin_url or '' }}"
                            placeholder="https://linkedin.com/in/..."
                        >

                    </div>

                </div>


                <!-- About Me -->

                <div class="mb-4">

                    <label class="form-label">
                        About Me
                    </label>

                    <textarea
                        name="bio"
                        class="form-control"
                        rows="5"
                        placeholder="Tell us about yourself and your recruitment experience..."
                    >{{ profile.bio or "" }}</textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="bi bi-check-lg me-1"></i>
                    Save Recruiter Profile
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
