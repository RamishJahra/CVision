{% extends "layouts/base.html" %}

{% block title %}
Edit Job | CVision
{% endblock %}

{% block content %}

<div class="container mt-5 pt-5">

    <div class="mb-4">

        <h1>Edit Job</h1>

        <p class="text-muted">
            Update your job posting.
        </p>

    </div>


    <div class="card border-0 shadow-sm p-4">

        <form method="POST">

            <div class="row g-3">

                <div class="col-md-8">

                    <label class="form-label">
                        Job Title *
                    </label>

                    <input
                        type="text"
                        name="job_title"
                        class="form-control"
                        value="{{ job.job_title }}"
                        required
                    >

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Job Type *
                    </label>

                    <select
                        name="job_type"
                        class="form-select"
                        required
                    >

                        <option
                            value="Full Time"
                            {% if job.job_type == "Full Time" %}selected{% endif %}
                        >
                            Full Time
                        </option>

                        <option
                            value="Part Time"
                            {% if job.job_type == "Part Time" %}selected{% endif %}
                        >
                            Part Time
                        </option>

                        <option
                            value="Contract"
                            {% if job.job_type == "Contract" %}selected{% endif %}
                        >
                            Contract
                        </option>

                        <option
                            value="Internship"
                            {% if job.job_type == "Internship" %}selected{% endif %}
                        >
                            Internship
                        </option>

                        <option
                            value="Remote"
                            {% if job.job_type == "Remote" %}selected{% endif %}
                        >
                            Remote
                        </option>

                    </select>

                </div>


                <div class="col-12">

                    <label class="form-label">
                        Job Description *
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="7"
                        required
                    >{{ job.description }}</textarea>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Experience Required
                    </label>

                    <input
                        type="text"
                        name="experience_required"
                        class="form-control"
                        value="{{ job.experience_required or '' }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Education Required
                    </label>

                    <input
                        type="text"
                        name="education_required"
                        class="form-control"
                        value="{{ job.education_required or '' }}"
                    >

                </div>


                <div class="col-12">

                    <label class="form-label">
                        Required Skills
                    </label>

                    <textarea
                        name="skills_required"
                        class="form-control"
                        rows="3"
                    >{{ job.skills_required or '' }}</textarea>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        value="{{ job.location or '' }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Salary
                    </label>

                    <input
                        type="text"
                        name="salary"
                        class="form-control"
                        value="{{ job.salary or '' }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Application Deadline
                    </label>

                    <input
                        type="date"
                        name="application_deadline"
                        class="form-control"
                        value="{% if job.application_deadline %}{{ job.application_deadline.strftime('%Y-%m-%d') }}{% endif %}"
                    >

                </div>

            </div>


            <div class="mt-4 d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for('recruiter.job_detail', job_id=job.id) }}"
                    class="btn btn-light"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
